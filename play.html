<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindred Play — Social Dice</title><meta name="description" content="Use Kindred Social Dice to get a low-pressure friendship activity based on your time and social energy."><link rel="canonical" href="https://findkindredpeople.com/play.html"><link rel="stylesheet" href="content.css"></head><body><header><div class="nav"><a class="brand" href="index.html">Kindred ✦</a><nav><a href="daily.html">Daily</a><a href="forum.html">Forum</a><a href="compatibility.html">Compatibility</a></nav></div></header><main class="wrap"><section class="hero"><span class="eyebrow">SOCIAL DICE</span><h1>Not sure what to do? Roll for a small social idea.</h1><p class="lead">Choose the effort that fits today. Kindred will suggest a manageable next step.</p></section><section class="card"><label>Time<select id="time"><option value="10">10 minutes</option><option value="30">30–60 minutes</option><option value="90">A few hours</option></select></label><label>Social energy<select id="energy"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label><p><button class="button" id="roll">Roll Social Dice</button></p><h2 id="result">Your idea will appear here.</h2><p id="why"></p></section><section class="card"><h2>Want people to do it with?</h2><a class="button" href="forum.html">Ask the Kindred community</a></section></main><script>const ideas={low:["Send one friendly follow-up message.","Save one local recurring activity to try later.","Reply thoughtfully to one forum discussion."],medium:["Visit a café, library or public activity and stay for 30 minutes.","Ask someone you know if they want a short walk this week.","Join a recurring class or language activity once."],high:["Invite two people to a small public meetup.","Try a group activity and introduce yourself to two people.","Start a forum thread proposing a coffee or walking meetup."]};document.getElementById("roll").onclick=()=>{let e=document.getElementById("energy").value,a=ideas[e],x=a[Math.floor(Math.random()*a.length)];document.getElementById("result").textContent=x;document.getElementById("why").textContent="Keep it low-pressure. A small repeatable action is more useful than forcing a perfect social day."};</script></body></html>
