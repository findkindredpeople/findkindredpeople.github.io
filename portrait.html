<meta name="theme-color" content="#16141a"><title>Kindred · Живая аватарка</title><style>:root{color-scheme:dark;font:16px/1.4 "DM Sans",Roboto,system-ui,sans-serif;color:#faf5f8;background:#16141a;--soft:#c9bbc6;--accent:#f7a5b9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 22% 10%,#30242c 0%,#16141a 65%);min-height:100svh}
main{max-width:920px;padding:clamp(14px,3.6vw,36px);margin:auto}header{display:flex;align-items:center;gap:10px;height:36px}
.brand{font-size:20px;font-weight:760;letter-spacing:-1px;display:inline-flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:20px;height:19px;transform:rotate(-12deg);border-radius:56% 44% 66% 34%;background:radial-gradient(circle at 65% 20%,#ffdcb6,#f397ae 58%,#ad799e)}
.format{margin-inline-start:auto;font-size:12px;letter-spacing:.055em;color:var(--soft)}

button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:2px solid #ffd5df;outline-offset:3px}
button:disabled,input:disabled{opacity:.51;cursor:default}[hidden]{display:none!important}
.editor{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(265px,.86fr);gap:clamp(18px,4vw,42px);align-items:center}
.stage{position:relative;isolation:isolate;display:grid;place-items:center;overflow:hidden;aspect-ratio:1/.99;border-radius:22px;background:#372b30;border:1px solid #54424d}
.ambient{position:absolute;z-index:-2;inset:-18%;background-position:center 40%;background-size:cover;filter:blur(28px) saturate(.85);opacity:.67}
.stage:after{content:"";z-index:-1;pointer-events:none;position:absolute;inset:0;background:linear-gradient(145deg,#21182055,#1f14211c 55%,#20172280)}
.stage-tools{position:absolute;inset:10px 11px auto;display:flex;align-items:center;justify-content:space-between;z-index:1;pointer-events:none}
#sample-badge,.stage-tools button{color:white;background:rgba(26,19,27,.64);border:1px solid #ffffff35}
#sample-badge{font-size:11px;padding:3px 10px;border-radius:99px}#play{margin-inline-start:auto;pointer-events:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
#play span{width:11px;height:14px;border-left:3px solid currentColor;border-right:3px solid currentColor}
#play[data-paused="true"] span{width:0;height:0;border:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid currentColor;transform:translateX(1px)}
.ring{width:82%;aspect-ratio:1;overflow:hidden;border:1px solid #fff9;border-radius:50%;box-shadow:0 6px 24px #1e121c4c;pointer-events:auto;touch-action:none}canvas{width:100%;height:100%;display:block}
.controls{min-width:0}#back{background:#3b323c;color:white;border-radius:50%;width:36px;height:36px;line-height:.8;font-size:32px;padding:0 0 4px}
.pick,.primary,.secondary{display:flex;gap:9px;align-items:center;justify-content:center;width:100%;min-height:45px;border-radius:14px;font-weight:660}
.pick{background:#302931;border:1px solid #5c4b58}.camera{font-size:22px;line-height:1;font-weight:400;color:var(--accent)}

.looks button{min-height:50px;padding:7px 3px;border-radius:12px;background:#29242c;border:1px solid #493e4a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;line-height:1.16}
.looks button[aria-pressed=true]{background:#47333f;border-color:#eaa5ba;color:#ffdae5}.swatch{display:block;width:25px;height:8px;border-radius:12px}

input[type=range]{margin:0 0 5px;width:100%;height:22px;accent-color:#f3aac0}.status{min-height:2.6em;font-size:12.5px;color:var(--soft);margin:4px 0 9px}
.primary{background:#f3acbd;color:#2a1822}.secondary{background:transparent;border:1px solid #66515e;color:#f5dde6;margin-top:8px}.primary:active,.pick:active,.looks button:active{transform:translateY(1px)}

<body><main>
<header><button type="button" id="back" hidden aria-label="Назад"><span aria-hidden="true">‹</span></button><span class="brand"><i aria-hidden="true"></i>Kindred</span><span class="format" data-i="format">GIF · 3,2 с</span></header>
<h1 data-i="title">Живая аватарка</h1>
<div class="editor">
<section class="stage" id="stage" aria-label="Предпросмотр аватарки">
  <div class="ambient" id="ambient" aria-hidden="true"></div>
  <div class="stage-tools"><span id="sample-badge" data-i="sample">Пример</span><button type="button" id="play" aria-label="Пауза"><span aria-hidden="true"></span></button></div>
  <div class="ring"><canvas id="preview" width="320" height="320"></canvas></div>
</section>
<section class="controls">
<button type="button" id="pick" class="pick"><span class="camera" aria-hidden="true">＋</span><span id="pick-label">Выбрать своё фото</span></button>
<input id="file" type="file" accept="image/*" hidden>
<fieldset id="looks"><legend data-i="look">Освещение</legend><div class="looks">
<button type="button" data-look="day" aria-pressed="true"><i class="swatch day"></i><span data-i="day">Дневной свет</span></button>
<button type="button" data-look="gold" aria-pressed="false"><i class="swatch gold"></i><span data-i="gold">Золотой час</span></button>
<button type="button" data-look="city" aria-pressed="false"><i class="swatch city"></i><span data-i="city">Ночной город</span></button>
</div></fieldset>
<div class="sliders"><label for="motion"><span data-i="motion">Движение</span><output id="motion-value">65%</output></label><input id="motion" type="range" min="0" max="100" value="65">
<label for="zoom"><span data-i="zoom">Масштаб</span><output id="zoom-value">1×</output></label><input id="zoom" type="range" min="80" max="170" value="100"></div>
<p class="status" id="status" role="status" aria-live="polite"></p>
<button type="button" class="primary" id="apply" hidden></button><button type="button" id="download" class="primary" data-i="download">Сохранить GIF</button>
</section></div>

<script>
/* All motion samples the original photograph. Coordinates below are in square output pixels. */
const LOOP_MS = 3200;
const clamp = (x, min, max) => Math.min(max, Math.max(min, x));
const smooth = (x) => { const t = clamp(x, 0, 1); return t * t * (3 - 2 * t); };
const makeCanvas = (w, h = w) => Object.assign(document.createElement("canvas"), {width:w, height:h});
const nextPaint = () => new Promise(resolve => setTimeout(resolve, 0));

function cropFor(portrait, framing) {
  const {width:w, height:h} = portrait.image;
  const face = portrait.face;
  const base = face ? Math.min(w, h, Math.max(face.w * 2.04, face.h * 1.83)) : Math.min(w,h);
  const side = Math.max(1, Math.min(w, h, base / framing.zoom));
  const cx = face ? face.x + face.w * .5 : w / 2;
  const cy = face ? face.y + face.h * .48 : h / 2;
  return {x:clamp(cx - side / 2 + framing.panX, 0, w-side),
          y:clamp(cy - side / 2 + framing.panY, 0, h-side), side, base, cx, cy};
}

function makeEye(points) {
  const a = points[0], b = points[3];
  const width = Math.hypot(b.x-a.x, b.y-a.y);
  if (width < 4) return null;
  const ux = (b.x-a.x)/width, uy = (b.y-a.y)/width;
  const nx = -uy, ny = ux;
  const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
  const depth = p => (p.x-cx)*nx + (p.y-cy)*ny;
  const top = (depth(points[1]) + depth(points[2])) * .5;
  const bottom = (depth(points[4]) + depth(points[5])) * .5;
  if (bottom-top < width*.075 || ny < .65) return null;
  return {cx,cy,ux,uy,nx,ny,width,top,bottom};
}

// Inverse vertical remapping moves the upper and lower lid textures toward one another.
function eyelidShift(x,y,e,blink) {
  const dx=x-e.cx, dy=y-e.cy;
  if (Math.abs(dx)>e.width*.65 || Math.abs(dy)>e.width*.66) return 0;
  const along=(dx*e.ux+dy*e.uy)/(e.width*.56);
  if (Math.abs(along)>=1) return 0;
  const taper=Math.sqrt(1-along*along), v=(dx*e.nx+dy*e.ny);
  const top=e.top*taper, bottom=e.bottom*taper, gap=bottom-top;
  const lid=blink*smooth((1-Math.abs(along))/.30);
  const upper=top+gap*.78*lid, lower=bottom-gap*.16*lid;
  const outerTop=top-e.width*.38*taper, outerBottom=bottom+e.width*.26*taper;
  if(v<=outerTop || v>=outerBottom) return 0;
  if(v<upper) return outerTop+(v-outerTop)*(top-outerTop)/(upper-outerTop)-v;
  if(v>lower) return bottom+(v-lower)*(outerBottom-bottom)/(outerBottom-lower)-v;
  return top+(v-upper)*gap/Math.max(.01,lower-upper)-v;
}

function prepareMotion(portrait, framing, look, size) {
  const crop=cropFor(portrait,framing);
  const canvas=makeCanvas(size), ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(portrait.image,crop.x,crop.y,crop.side,crop.side,0,0,size,size);
  const source=ctx.getImageData(0,0,size,size);
  const pixels=source.data, scale=size/crop.side;
  const points=portrait.points?.map(p=>({x:(p.x-crop.x)*scale,y:(p.y-crop.y)*scale}));
  const face=portrait.face;
  const cx=points ? points[30].x : size*.5;
  const cy=points ? (points[27].y+points[33].y)*.5 : size*.46;
  const width=face ? Math.max(8,face.w*scale) : size*.42;
  const height=face ? Math.max(8,face.h*scale) : size*.5;
  const eyes=points ? [makeEye(points.slice(36,42)),makeEye(points.slice(42,48))].filter(Boolean) : [];
  const corners=points ? [points[48],points[54]] : [];
  const weight=new Float32Array(size*size), depth=new Float32Array(size*size);
  const shoulders=new Float32Array(size*size), smile=new Float32Array(size*size);
  const frame=ctx.createImageData(size,size);
  for(let y=0,i=0;y<size;y++) for(let x=0;x<size;x++,i++){
    const rx=(x-cx)/(width*.77), ry=(y-cy)/(height*.88);
    const ellipse=rx*rx+ry*ry;
    weight[i]=points?smooth((1.55-ellipse)/1.12):0;
    depth[i]=points?Math.max(0,1-ellipse)**2:0;
    const sideMask=smooth((1.55-Math.abs(rx))/.68);
    shoulders[i]=points?smooth((y-cy-height*.22)/(height*.56))*sideMask:0;
    if(corners.length){
      const dx1=(x-corners[0].x)/(width*.16), dx2=(x-corners[1].x)/(width*.16);
      const dy1=(y-corners[0].y)/(height*.13), dy2=(y-corners[1].y)/(height*.13);
      smile[i]=Math.max(0,1-Math.min(dx1*dx1+dy1*dy1,dx2*dx2+dy2*dy2))**2;
    }
    // Coloured side light is strongest around the subject. Skin keeps its original texture.
    const u=x/size, v=y/size, bg=1-weight[i]*.66;
    let r=0,g=0,b=0;
    if(look==="gold"){
      const sun=(.24+.76*(1-u)**1.7)*(1-.38*v)*bg;
      r=25*sun+2; g=11*sun; b=-13*sun-1;
    } else if(look==="city"){
      const left=(1-u)**1.6*bg, right=u**1.8*bg;
      r=22*right-12*left; g=11*left-7*right; b=15*left+19*right;
    }
    const k=i*4;
    pixels[k]+=r; pixels[k+1]+=g; pixels[k+2]+=b; frame.data[k+3]=255;
  }
  return {size,pixels,weight,depth,shoulders,smile,eyes,cx,cy,width,height,frame,hasFace:!!points};
}

function drawMotion(rig, t, strength) {
  const {size,pixels,weight,depth,shoulders,smile,eyes,cx,cy,width,height,frame,hasFace}=rig;
  const phase=t*2*Math.PI;
  const sway=Math.sin(phase), nod=(1-Math.cos(phase))*.5;
  const breath=Math.sin(phase-.26)-Math.sin(-.26);
  const tilt=.012*sway*strength, yaw=.026*width*sway*strength;
  const down=height*.022*nod*strength, chest=size*.0048*breath*strength;
  const grin=height*.0105*nod*strength;
  const pulse=Math.abs(t-.485);
  const blink=pulse<.048 ? smooth(1-pulse/.048)*Math.min(1,strength*1.65) : 0;
  const camX=hasFace?0:size*.012*sway*strength, camY=hasFace?0:size*.011*nod*strength;
  const invScale=hasFace?1:1/(1+.038*strength);
  const max=size-1.001, out=frame.data;
  for(let y=0,i=0;y<size;y++) for(let x=0;x<size;x++,i++){
    let u=x,v=y;
    if(hasFace){
      const w=weight[i];
      u-=w*((-tilt)*(y-cy)+yaw*.32)+depth[i]*yaw*.68;
      v-=w*(tilt*(x-cx)+down)-grin*smile[i]+chest*shoulders[i];
      if(blink>.008){
        for(let j=0;j<eyes.length;j++){
          const e=eyes[j], d=eyelidShift(u,v,e,blink);
          if(d){u+=d*e.nx;v+=d*e.ny;break;}
        }
      }
    }else{
      u=(x-size*.5)*invScale+size*.5+camX;
      v=(y-size*.5)*invScale+size*.5+camY;
    }
    u=clamp(u,0,max);v=clamp(v,0,max);
    const x0=u|0,y0=v|0,fx=u-x0,fy=v-y0;
    const a=4*(y0*size+x0),b=a+4*size,k=i*4;
    for(let c=0;c<3;c++){
      const top=pixels[a+c]+(pixels[a+4+c]-pixels[a+c])*fx;
      const bottom=pixels[b+c]+(pixels[b+4+c]-pixels[b+c])*fx;
      out[k+c]=top+(bottom-top)*fy;
    }
  }
  return frame;
}

// Reserve index 255 for pixels that can be copied from the previous GIF frame.
function indexedMapper(palette) {
  const cache=new Int16Array(32768).fill(-1);
  return rgba=>{
    const idx=new Uint8Array(rgba.length/4);
    for(let i=0,k=0;i<idx.length;i++,k+=4){
      const code=((rgba[k]>>3)<<10)|((rgba[k+1]>>3)<<5)|(rgba[k+2]>>3);
      if(cache[code]<0){
        const r=((code>>10)<<3)+4,g=(((code>>5)&31)<<3)+4,b=((code&31)<<3)+4;
        let best=0,min=Infinity;
        for(let j=0;j<palette.length;j++){
          const p=palette[j],dr=r-p[0],dg=g-p[1],db=b-p[2],d=3*dr*dr+5*dg*dg+2*db*db;
          if(d<min){best=j;min=d;}
        }
        cache[code]=best;
      }
      idx[i]=cache[code];
    }
    return idx;
  };
}
async function encodePortrait(portrait, framing, look, strength, size, count, limit, progress) {
  const rig=prepareMotion(portrait,framing,look,size), encoder=gifenc.GIFEncoder();
  const first=drawMotion(rig,0,strength);
  const colors=gifenc.quantize(first.data,255,{format:"rgb565"});
  const map=indexedMapper(colors);
  const palette=colors.slice();
  while(palette.length<256) palette.push([0,0,0]);
  let previous=null;
  const displayed=new Uint8Array(size*size*3);
  for(let f=0;f<count;f++){
    const frame=f===0?first:drawMotion(rig,f/count,strength);
    const indices=map(frame.data), delta=indices.slice();
    // Keep already displayed near-identical colours. This avoids shimmer in skin tones
    // and leaves enough space for a detailed first frame within the profile field.
    const rgba=frame.data;
    for(let i=0,k=0,p=0;i<delta.length;i++,k+=4,p+=3){
      const similar=previous && (indices[i]===previous[i] ||
        (Math.abs(rgba[k]-displayed[p])<10 && Math.abs(rgba[k+1]-displayed[p+1])<9 &&
         Math.abs(rgba[k+2]-displayed[p+2])<12));
      if(similar){delta[i]=255;indices[i]=previous[i];}
      else{displayed[p]=rgba[k];displayed[p+1]=rgba[k+1];displayed[p+2]=rgba[k+2];}
    }
    const delay=10*(Math.round((f+1)*LOOP_MS/count/10)-Math.round(f*LOOP_MS/count/10));
    encoder.writeFrame(delta,size,size,{palette:f===0?palette:null,repeat:0,dispose:1,
      transparent:f>0,transparentIndex:255,delay});
    previous=indices;
    if(limit && encoder.stream.bytesView().length>limit) return null;
    if(f%3===0){progress(f/count);await nextPaint();}
  }
  encoder.finish();
  return encoder.bytes();
}

async function makePortraitGif(portrait,framing,look,strength,forProfile,progress) {
  const limit=forProfile?510000:0;
  const attempts=forProfile?[[320,32],[288,26],[256,24],[224,24],[192,24],[160,24],[128,20]]:[[432,40]];
  for(const [size,frames] of attempts){
    const bytes=await encodePortrait(portrait,framing,look,strength,size,frames,limit,progress);
    if(bytes && (!limit || bytes.length<=limit)) return new Blob([bytes],{type:"image/gif"});
  }
  throw new Error("profile GIF exceeds size budget");
}

<script>
"use strict";
const el=id=>document.getElementById(id);

  detail:"intro",language:"ru",phase:0,analysisId:0,frameTime:0,clock:0,active:true,raf:0};

}
function translate(code){
  const short=String(code||"ru").toLowerCase().split(/[-_]/)[0];
  state.language=Object.prototype.hasOwnProperty.call(LABELS,short)?short:"en";
  document.documentElement.lang=state.language;
  document.documentElement.dir=short==="ar"?"rtl":"ltr";
  document.title="Kindred · "+label("title");
  document.querySelectorAll("[data-i]").forEach(n=>{n.textContent=label(n.dataset.i);});
  el("back").setAttribute("aria-label",label("back"));el("stage").setAttribute("aria-label",label("preview"));
  el("pick-label").textContent=label(state.sample?"pick":"change");el("apply").textContent=label("apply");
  setPlayingIcon();status(state.detail);
}
function lock(value){
  state.busy=value;
  el("pick").disabled=value;
  el("looks").disabled=value;el("motion").disabled=value;el("zoom").disabled=value;
  el("play").disabled=value||!state.portrait;el("apply").disabled=value||state.sample||!state.portrait;
  el("download").disabled=value||!state.portrait;
  if(!value) scheduleFrame();
}
function bytesOf(base64){
  const text=atob(base64),bytes=new Uint8Array(text.length);
  for(let i=0;i<text.length;i++)bytes[i]=text.charCodeAt(i);
  return bytes;
}
async function loadModels(){
  if(!initializedModels) initializedModels=(async()=>{
    // CPU inference also works offline on WebViews that disable WebGL.
    await faceapi.tf.setBackend("cpu");
    for(const [net,model] of [[faceapi.nets.tinyFaceDetector,PORTRAIT_MODELS.detector],
      [faceapi.nets.faceLandmark68Net,PORTRAIT_MODELS.landmarks]]){
      const weights=faceapi.tf.io.decodeWeights(bytesOf(model.bytes).buffer,model.specs);
      net.loadFromWeightMap(weights);

}
async function analyze(image){
  await loadModels();

  const input=makeCanvas(Math.max(1,Math.round(image.width*ratio)),Math.max(1,Math.round(image.height*ratio)));
  input.getContext("2d").drawImage(image,0,0,input.width,input.height);
  const options=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.42});
  const faces=await faceapi.detectAllFaces(input,options).withFaceLandmarks();
  if(faces.length!==1) return {image,face:null,points:null,reason:faces.length?"many":"noface"};
  const f=faces[0],sx=image.width/input.width,sy=image.height/input.height,b=f.detection.box;
  const points=f.landmarks.positions.map(p=>({x:p.x*sx,y:p.y*sy}));
  const left=points[36],right=points[45];
  const spacing=Math.hypot(left.x-right.x,left.y-right.y);
  if(spacing<b.width*sx*.26 || Math.abs(left.y-right.y)>spacing*.65 || b.width*sx<28)
    return {image,face:null,points:null,reason:"noface"};

function imageFrom(url){
  return new Promise((resolve,reject)=>{
    const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=url;
  });
}

  const id=++state.analysisId;

    const img=await imageFrom(url);
    // The built-in example is an existing Kindred profile card. Only its photograph is used.
    const inset=sample?{x:15,y:16,w:img.width-30,h:img.height*.80}:{x:0,y:0,w:img.width,h:img.height};
    const k=Math.min(1,1120/Math.max(inset.w,inset.h));
    const image=makeCanvas(Math.max(1,Math.round(inset.w*k)),Math.max(1,Math.round(inset.h*k)));
    const ctx=image.getContext("2d");
    ctx.fillStyle="#302b30";ctx.fillRect(0,0,image.width,image.height);
    ctx.drawImage(img,inset.x,inset.y,inset.w,inset.h,0,0,image.width,image.height);
    await nextPaint();
    let portrait;
    try{portrait=await analyze(image);}
    catch(_){portrait={image,face:null,points:null,reason:"noface"};}
    if(id!==state.analysisId)return;
    state.portrait=portrait;state.sample=sample;state.detail=sample?"intro":portrait.reason;
    state.framing={zoom:1,panX:0,panY:0};state.phase=0;state.clock=0;state.frameTime=0;
    el("sample-badge").hidden=!sample;el("pick-label").textContent=label(sample?"pick":"change");
    el("zoom").value="100";el("zoom-value").textContent="1×";
    const thumb=makeCanvas(96);
    const crop=cropFor(portrait,state.framing);
    thumb.getContext("2d").drawImage(image,crop.x,crop.y,crop.side,crop.side,0,0,96,96);
    el("ambient").style.backgroundImage="url("+thumb.toDataURL("image/jpeg",.7)+")";
    rebuild();status(state.detail);
  }catch(_){if(id===state.analysisId)status("openerror");}
  finally{if(id===state.analysisId)lock(false);}
}
const preview=el("preview"), previewContext=preview.getContext("2d",{alpha:false});
function showFrame(){if(state.rig) previewContext.putImageData(drawMotion(state.rig,state.phase,state.strength),0,0);}
function rebuild(){
  if(!state.portrait)return;
  state.rig=prepareMotion(state.portrait,state.framing,state.look,preview.width);
  showFrame();scheduleFrame();
}
function scheduleFrame(){

    state.raf=requestAnimationFrame(tick);
}
function tick(time){

  if(!state.clock)state.clock=time-state.phase*LOOP_MS;
  if(time-state.frameTime>=51){
    state.phase=((time-state.clock)%LOOP_MS)/LOOP_MS;
    state.frameTime=time;showFrame();
  }

}
function setActive(active){state.active=active;state.clock=0;if(active)scheduleFrame();}
document.addEventListener("visibilitychange",()=>{state.clock=0;scheduleFrame();});
el("play").onclick=()=>{state.paused=!state.paused;state.clock=0;setPlayingIcon();scheduleFrame();};
el("pick").onclick=()=>{if(nativeBridge)nativeBridge.choosePhoto();else el("file").click();};
el("file").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";
  if(!file)return;
  if(file.size>32*1024*1024){status("large");return;}
  const url=URL.createObjectURL(file);

};
document.querySelectorAll("[data-look]").forEach(button=>{
  button.onclick=()=>{
    state.look=button.dataset.look;
    document.querySelectorAll("[data-look]").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));

  };
});
el("motion").oninput=()=>{
  state.strength=Number(el("motion").value)/100;
  el("motion-value").textContent=Math.round(state.strength*100)+"%";showFrame();
};
el("zoom").oninput=()=>{
  state.framing.zoom=Number(el("zoom").value)/100;
  el("zoom-value").textContent=Number(state.framing.zoom.toFixed(2))+"×";rebuild();
};
const ring=document.querySelector(".ring");
let drag=null, redraw=0;
function reframe(){if(!redraw)redraw=requestAnimationFrame(()=>{redraw=0;rebuild();});}

  if(state.busy||!state.portrait)return;

  if(!drag||drag.id!==e.pointerId||state.busy)return;

  const scale=crop.side/ring.getBoundingClientRect().width;
  const left=clamp(crop.x-(e.clientX-drag.x)*scale,0,image.width-crop.side);
  const top=clamp(crop.y-(e.clientY-drag.y)*scale,0,image.height-crop.side);
  state.framing.panX=left-crop.cx+crop.side/2;state.framing.panY=top-crop.cy+crop.side/2;
  drag.x=e.clientX;drag.y=e.clientY;reframe();
};

  return new Promise((resolve,reject)=>{const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);});

el("apply").onclick=()=>exportGif(true);

el("back").onclick=()=>{if(nativeBridge)nativeBridge.closeEditor();else if(profileHost)notifyHost("close");};

window.KindredPortrait={

  photo(data){return loadPortrait(data);},result:nativeResult,setActive
};
el("back").hidden=!integrated;el("apply").hidden=!integrated;
if(integrated)el("download").className="secondary";
translate((typeof location !== "undefined" && new URLSearchParams(location.search).get("lang")) || "ru");
lock(true);
if(profileHost){
  window.addEventListener("message",event=>{
    if(event.origin!==location.origin || event.source!==window.parent || event.data?.channel!=="kindred-avatar")return;
    const msg=event.data;
    if(msg.action==="init")window.KindredPortrait.init(msg.language,msg.photo);
    else if(msg.action==="result")nativeResult(msg.result);
  });
  notifyHost("ready");
} else if(!nativeBridge)loadPortrait(SAMPLE_PHOTO,true);

</script>
</body></html>
