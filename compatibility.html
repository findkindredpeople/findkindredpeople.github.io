<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friendship Compatibility — Kindred</title><meta name="description" content="Compare friendship preferences and get practical conversation and activity ideas."><link rel="canonical" href="https://findkindredpeople.com/compatibility.html"><link rel="stylesheet" href="content.css"></head><body><header><div class="nav"><a class="brand" href="index.html">Kindred ✦</a><nav><a href="daily.html">Daily</a><a href="play.html">Play</a><a href="forum.html">Forum</a></nav></div></header><main class="wrap"><section class="hero"><span class="eyebrow">FRIENDSHIP COMPATIBILITY</span><h1>What kind of friendship fits you?</h1><p class="lead">This is not a scientific score. It is a conversation tool for noticing preferences that can make friendship easier.</p></section><section class="card"><label>Your ideal pace<select id="pace"><option>Weekly plans</option><option>Spontaneous plans</option><option>Occasional catch-ups</option></select></label><label>Best setting<select id="setting"><option>One-to-one</option><option>Small group</option><option>Large group</option></select></label><label>Favourite connection<select id="style"><option>Deep conversations</option><option>Shared activities</option><option>A mix of both</option></select></label><p><button class="button" id="go">Show my friendship style</button></p><div id="result"></div></section><section class="card"><h2>Find a conversation around your style</h2><a class="button" href="forum.html">Visit the forum</a></section></main><script>document.getElementById("go").onclick=()=>{let p=document.getElementById("pace").value,s=document.getElementById("setting").value,t=document.getElementById("style").value;document.getElementById("result").innerHTML="<h2>Your preferences</h2><p>You seem to prefer <b>"+p.toLowerCase()+"</b>, usually in a <b>"+s.toLowerCase()+"</b>, with <b>"+t.toLowerCase()+"</b>.</p><p>Try asking a new friend: “What kind of plans feel easiest for you to keep?” Then choose one activity that works for both of you.</p>"};</script></body></html>
