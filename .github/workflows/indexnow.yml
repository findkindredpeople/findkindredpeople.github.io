name: Notify search engines after publication
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'indexnow-key.txt'
      - 'scripts/notify-indexnow.py'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kindred-indexnow
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Wait for public pages, then submit to IndexNow
        run: python3 scripts/notify-indexnow.py
