name: Kindred community upgrade
on:
  push:
    branches: [codex/kindred-community-upgrade]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs tests/worker/*.test.mjs
      - run: node --check kindred-app.js && node --check community-tools.js && node --check arcade.js && node --check worker/kindred-push.js
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: tests/firestore
      - run: npx firebase emulators:exec --only firestore --project demo-kindred-arcade 'npm test'
        working-directory: tests/firestore
