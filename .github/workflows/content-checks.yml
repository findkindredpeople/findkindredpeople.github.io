name: Kindred content tools checks
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.mjs'
      - 'tests/**'
      - '.github/workflows/content-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --check social-tools.js
