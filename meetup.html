<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindred Meetup</title><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="content.css"><style>.layout{display:grid;grid-template-columns:2fr 1fr;gap:18px}.person,.msg{padding:9px 0;border-bottom:1px solid #eee}.meta{color:#746d82;font-size:14px}textarea{width:100%;min-height:80px;padding:11px;border:1px solid #ddd4ed;border-radius:12px}.danger{background:#fff0f0}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style></head><body><header><div class="nav"><a class="brand" href="index.html">Kindred ✦</a><nav><a href="meetups.html">Meetups</a><a href="forum.html">Forum</a><a href="safety.html">Safety</a></nav></div></header><main class="wrap"><p><a href="meetups.html">← All meetups</a></p><div id="loading" class="card">Loading meetup…</div><div id="content" hidden><section class="hero"><span class="eyebrow" id="type"></span><h1 id="title"></h1><p class="lead" id="details"></p><p class="meta" id="when"></p></section><div class="layout"><section class="card"><h2>Meetup discussion</h2><p id="authNote" class="meta">Sign in on the Meetups page to participate.</p><form id="chatForm" hidden><textarea id="message" maxlength="500" required placeholder="Coordinate meetup details. Do not post phone numbers or home addresses."></textarea><button class="button">Post message</button></form><div id="messages"></div></section><aside><section class="card"><h2>Organizer</h2><p id="organizer"></p></section><section class="card"><h2>Interested people</h2><div id="people"></div></section><section class="card danger" id="ownerBox" hidden><h2>Organizer controls</h2><p>Cancel this meetup if it will not take place.</p><button class="button" id="cancel">Cancel meetup</button></section></aside></div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{addDoc,collection,doc,getFirestore,getDoc,onSnapshot,orderBy,query,serverTimestamp,updateDoc}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyDeuW583lgxl08k-DYDju7jQiZP2jVqUk4',authDomain:'kindred-507209.firebaseapp.com',projectId:'kindred-507209',storageBucket:'kindred-507209.firebasestorage.app',messagingSenderId:'459167088901',appId:'1:459167088901:web:c13b3aeaf9d6e41e9cf76c'}),auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null,data=null,id=new URLSearchParams(location.search).get('id');function owner(){let yes=user&&data&&user.uid===data.creatorId;$('#ownerBox').hidden=!yes;$('#chatForm').hidden=!user;$('#authNote').hidden=!!user}onAuthStateChanged(auth,x=>{user=x;owner()});if(!id){$('#loading').textContent='Meetup not found.'}else{getDoc(doc(db,'meetups',id)).then(s=>{if(!s.exists())throw 0;data=s.data();$('#loading').hidden=true;$('#content').hidden=false;$('#type').textContent=data.type;$('#title').textContent=data.city+', '+data.country;$('#details').textContent=data.details;$('#when').textContent=data.date+' · '+data.time+' · '+data.language+(data.status!=='visible'?' · '+data.status.toUpperCase():'');$('#organizer').innerHTML='<a href="profile.html?uid='+encodeURIComponent(data.creatorId)+'">'+safe(data.creatorName)+'</a>';owner()}).catch(()=>{$('#loading').textContent='This meetup is unavailable or has been removed.'});onSnapshot(collection(db,'meetups',id,'interested'),s=>{$('#people').innerHTML=s.size?s.docs.map(z=>'<div class="person"><a href="profile.html?uid='+encodeURIComponent(z.id)+'">'+safe(z.data().userName||'Kindred member')+'</a></div>').join(''):'<p class="meta">No one has joined yet.</p>'});onSnapshot(query(collection(db,'meetups',id,'messages'),orderBy('createdAt','asc')),s=>{$('#messages').innerHTML=s.docs.map(z=>{let m=z.data();return '<div class="msg"><strong>'+safe(m.authorName)+'</strong><p>'+safe(m.text)+'</p></div>'}).join('')||'<p class="meta">No messages yet.</p>'},()=>{$('#messages').innerHTML='<p class="meta">Join this meetup to view its discussion.</p>'})}$('#chatForm').onsubmit=async e=>{e.preventDefault();let text=$('#message').value.trim();if(!user||!data||!text)return;try{await addDoc(collection(db,'meetups',id,'messages'),{authorId:user.uid,authorName:user.displayName||'Kindred member',text:text.slice(0,500),createdAt:serverTimestamp()});$('#message').value=''}catch(e){alert('Join the meetup before posting in its discussion.')}};$('#cancel').onclick=async()=>{if(!user||!data||user.uid!==data.creatorId||!confirm('Cancel this meetup?'))return;try{await updateDoc(doc(db,'meetups',id),{status:'cancelled'});data.status='cancelled';$('#when').textContent=data.date+' · '+data.time+' · '+data.language+' · CANCELLED';$('#cancel').disabled=true}catch(e){alert('Could not cancel meetup.')}};</script></body></html>
